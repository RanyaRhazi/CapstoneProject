name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests (models mocked)
        run: python -m unittest discover -s tests -t . -v

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install datasets soundfile jiwer
      - name: Run both models on real speech
        run: |
          set -o pipefail
          python -X faulthandler -u scripts/smoke_test.py 2>&1 | tee smoke.txt || {
            echo "::error title=Smoke test failed::$(tail -c 3500 smoke.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          echo "::notice title=Smoke test output::$(tail -c 3500 smoke.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
